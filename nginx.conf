server {
    listen 80;
    listen 443 ssl http2;
    server_name jobradar.xin www.jobradar.xin;

    ssl_certificate     /etc/nginx/ssl/jobradar.xin.pem;
    ssl_certificate_key /etc/nginx/ssl/jobradar.xin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_buffer_size     4k;

    # HTTP → HTTPS redirect
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    # ── 反爬说明：UA 拦截已移除（避免 if 变量陷阱误伤注册登录）。
    #    反爬改由后端 BotFilter 处理，其已对 /api/auth/ 完全放行。
    #    仅保留漏洞扫描路径拦截（见下方 location）。

    # ── 反爬：拦截漏洞扫描路径 ──
    location ~* ^/(wp-admin|wp-login|phpmyadmin|\.env|\.git|admin\.php|actuator|swagger|api-docs|cgi-bin) {
        return 444;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Static files
    root /usr/share/nginx/html;
    index index.html;

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # /api/jobs
    location /api/jobs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 静态资源：CSS/字体/图片 — 浏览器缓存 7 天
    location ~* \.(css|woff2|woff|ttf|svg|png|jpg|jpeg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }
    # JS 文件不缓存（ES module 子模块无版本号，频繁更新必须每次拉最新）
    location ~* \.js$ {
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
    }

    # SPA routing（HTML 不缓存，保证拿到最新版本）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
