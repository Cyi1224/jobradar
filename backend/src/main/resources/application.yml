server:
  port: 8080

spring:
  # ── 默认（dev）：H2 文件库，重启数据不丢，文件写在 backend/data/ 目录 ──
  datasource:
    url: jdbc:h2:file:./data/jobradar;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update           # dev：保留现有数据，只补新字段
    show-sql: false
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.batch_size: 200   # 批量灌库（14k 校招数据）
      hibernate.order_inserts: true
  h2:
    console:
      enabled: true              # http://localhost:8080/h2-console
      path: /h2-console

# ── JobRadar 自定义开关 ──
jobradar:
  # 是否灌入演示用的「我的投递 / 简历 / 个人资料」假数据（生产请关，见 application-prod.yml）。
  # 校招信息库（jobs）始终会在库为空时灌入，不受此开关影响。
  seed-demo: true
  cors:
    allowed-origins: "*"        # dev 放行全部；生产收窄，见 application-prod.yml
  payment:
    demo-mode: true             # dev：允许「点击即开通」便于联调；生产为 false（见 application-prod.yml）
    zpay:
      pid: 2026070309233444
      key: 335Y7XNoUFJ6ua6CLjKFGSiB0lu9qptd
      submit-url: https://zpayz.cn/mapi.php
      notify-url: http://localhost:8080/api/payment/notify
      return-url: http://localhost:8123/index.html
      test-amount: 0.01          # 本地联调：强制用 0.01 元测试支付；生产不配此项走真实价格
  # 每日同步脚本 POST /api/jobs/sync 所需的鉴权 token，与 givemeoc_sync.py 的 JOBRADAR_SYNC_TOKEN 保持一致
  sync-token: changeme          # 生产请改为强随机串，用环境变量 JOBRADAR_SYNC_TOKEN 覆盖（见 application-prod.yml）
  admin:
    account: ${ADMIN_ACCOUNT:2426155413}   # 管理后台登录账号（可用环境变量覆盖）
    password: ${ADMIN_PASSWORD:123456}     # 管理后台登录密码
    api-key: admin-demo-key-change-me      # dev：管理后台 API Key，生产用环境变量 ADMIN_API_KEY 覆盖

# ── offerbiu 校招数据每日同步 ──
offerbiu:
  base-url: https://offerbiu.com
  sync:
    enabled: false             # 本地开发默认关闭，生产在 application-prod.yml 中开启

# ── offerqingbaoju 校招数据每日同步（只取源站最新更新批次） ──
offerqingbaoju:
  base-url: https://offerqingbaoju.cn
  sync:
    enabled: false             # 本地开发默认关闭，生产在 application-prod.yml 中开启
    navigation-ids: 61         # 默认「27届秋招」，逗号分隔可配多个
    page-size: 5000            # 源站第 2 页起需登录，靠大 per_page 一页匿名拉全当前全量

# ── 上线：用 prod profile 切到 MySQL（持久化、不灌演示数据），见 application-prod.yml ──
#   构建：mvn clean package -DskipTests
#   运行：java -jar app.jar --spring.profiles.active=prod
#   连接参数走环境变量：DB_HOST / DB_PORT / DB_NAME / DB_USER / DB_PASSWORD
