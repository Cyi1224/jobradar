<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobRadar 数据看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
</script>
<style>
/* ── 基础重置 ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand: #1A56DB;
  --brand-2: #3B82F6;
  --brand-light: #EBF2FF;
  --brand-grad: linear-gradient(135deg, #2563EB 0%, #1A56DB 55%, #1E40AF 100%);
  --c-bg-0:#fff; --c-bg-1:#F4F6FB; --c-bg-2:#EDF0F7;
  --c-text-1:#0F1729; --c-text-2:#4B5565; --c-text-3:#9CA3AF;
  --shadow-sm:0 1px 3px rgba(15,23,41,0.06),0 1px 2px rgba(15,23,41,0.04);
  --shadow-md:0 6px 16px -6px rgba(15,23,41,0.12),0 2px 6px -2px rgba(15,23,41,0.07);
  --shadow-lg:0 18px 40px -12px rgba(15,23,41,0.20),0 8px 16px -8px rgba(15,23,41,0.10);
  --font-display:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,-apple-system,'Segoe UI',sans-serif;
  --radius-sm:7px; --radius-md:10px; --radius-lg:16px;
  --blue:#3B82F6; --green:#10B981; --purple:#8B5CF6; --amber:#F59E0B;
}
body{
  font-family:var(--font-body); background:var(--c-bg-1); color:var(--c-text-1);
  min-height:100vh; line-height:1.5; -webkit-font-smoothing:antialiased;
}

/* ── 顶部导航 ── */
.navbar{
  background:var(--brand-grad); color:#fff; padding:14px 32px;
  display:flex; align-items:center; justify-content:space-between;
  box-shadow:0 2px 12px rgba(26,86,219,0.25); position:sticky; top:0; z-index:100;
}
.navbar h1{ font-family:var(--font-display); font-size:20px; font-weight:700; letter-spacing:-0.01em; }
.navbar .nav-right{ display:flex; align-items:center; gap:16px; font-size:14px; }
.navbar .nav-right select{
  padding:6px 12px; border-radius:var(--radius-sm); border:none;
  background:rgba(255,255,255,0.18); color:#fff; font-size:13px; cursor:pointer;
}
.navbar .nav-right select option{ color:#0F1729; }
.navbar .nav-right button{
  padding:6px 16px; border-radius:var(--radius-sm); border:1px solid rgba(255,255,255,0.4);
  background:rgba(255,255,255,0.12); color:#fff; font-size:13px; cursor:pointer;
  transition:background .2s;
}
.navbar .nav-right button:hover{ background:rgba(255,255,255,0.25); }
.navbar .live-dot{
  display:inline-block; width:8px; height:8px; border-radius:50%; background:#10B981;
  margin-right:6px; animation:pulse 2s infinite;
}
@keyframes pulse{ 0%,100% {opacity:1} 50% {opacity:0.4} }
.last-update{ font-size:12px; opacity:0.7; }

/* ── 内容 ── */
.container{ max-width:1320px; margin:0 auto; padding:24px 32px; }

/* ── 统计卡片网格 ── */
.stat-grid{
  display:grid; grid-template-columns:repeat(6, 1fr); gap:20px; margin-bottom:28px;
}
.stat-card{
  background:var(--c-bg-0); border-radius:var(--radius-lg); padding:22px 24px;
  box-shadow:var(--shadow-sm); border:1px solid var(--c-bg-2);
  display:flex; align-items:center; gap:16px; transition:transform .15s,box-shadow .15s;
}
.stat-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-md); }
.stat-icon{
  width:48px; height:48px; border-radius:var(--radius-md); display:flex;
  align-items:center; justify-content:center; font-size:22px; flex-shrink:0;
}
.stat-icon.blue{ background:#EBF2FF; color:var(--blue); }
.stat-icon.green{ background:#ECFDF5; color:var(--green); }
.stat-icon.purple{ background:#F3F0FF; color:var(--purple); }
.stat-icon.amber{ background:#FFFBEB; color:var(--amber); }
.stat-icon.red{ background:#FEF2F2; color:#EF4444; }
.stat-icon.indigo{ background:#EEF2FF; color:#6366F1; }
.stat-body .stat-label{ font-size:13px; color:var(--c-text-2); margin-bottom:2px; }
.stat-body .stat-value{ font-family:var(--font-display); font-size:28px; font-weight:700; letter-spacing:-0.01em; }
.stat-body .stat-sub{ font-size:12px; color:var(--c-text-3); margin-top:2px; }

/* ── 图表行 ── */
.chart-row{
  display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:28px;
}
.chart-row.three-col{ grid-template-columns:1fr 1fr 1fr; }
.chart-row.two-one{ grid-template-columns:2fr 1fr; }
.chart-card{
  background:var(--c-bg-0); border-radius:var(--radius-lg); padding:20px 24px;
  box-shadow:var(--shadow-sm); border:1px solid var(--c-bg-2);
}
.chart-card h3{
  font-family:var(--font-display); font-size:15px; font-weight:600;
  color:var(--c-text-1); margin-bottom:16px; display:flex; align-items:center; gap:8px;
}
.chart-card h3 .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
.chart-card canvas{ width:100% !important; max-height:300px; }

/* ── 最近访问表 ── */
.table-wrap{ overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-size:13px; }
th{ text-align:left; padding:10px 14px; color:var(--c-text-2); font-weight:500; border-bottom:2px solid var(--c-bg-2); white-space:nowrap; }
td{ padding:10px 14px; border-bottom:1px solid var(--c-bg-2); white-space:nowrap; color:var(--c-text-1); }
tr:hover td{ background:var(--brand-light); }
.badge{
  display:inline-block; padding:2px 10px; border-radius:12px; font-size:11px; font-weight:500;
}
.badge.api{ background:#EEF2FF; color:#4338CA; }
.badge.page{ background:#ECFDF5; color:#059669; }
.badge.member{ background:#FEF3C7; color:#B45309; }
.badge.free{ background:#F3F4F6; color:#6B7280; }
.badge-search{ background:#FFF7ED; color:#C2410C; }
.badge-ext{ background:#F3F4F6; color:#6B7280; }
.badge-direct{ background:#F0FDF4; color:#166534; }

/* ── 分页 ── */
.pagination{
  display:flex; align-items:center; justify-content:center; gap:8px;
  margin-top:16px; padding-top:12px; border-top:1px solid var(--c-bg-2);
}
.pagination button{
  padding:6px 14px; border:1px solid var(--c-bg-2); border-radius:var(--radius-sm);
  background:var(--c-bg-0); color:var(--c-text-1); font-size:13px; cursor:pointer;
  font-family:var(--font-body); transition:all .15s;
}
.pagination button:hover:not(:disabled){ border-color:var(--brand-2); color:var(--brand-2); background:var(--brand-light); }
.pagination button:disabled{ opacity:0.4; cursor:default; }
.pagination button.active{ background:var(--brand); color:#fff; border-color:var(--brand); }
.pagination .page-info{ font-size:13px; color:var(--c-text-2); }
.loading-row td{ text-align:center; padding:30px; color:var(--c-text-3); }

/* ── 登录遮罩 ── */
.auth-overlay{
  position:fixed; inset:0; background:rgba(15,23,41,0.5); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center; z-index:999;
}
.auth-dialog{
  background:var(--c-bg-0); border-radius:var(--radius-lg); padding:36px 40px;
  box-shadow:var(--shadow-lg); max-width:400px; width:90%; text-align:center;
}
.auth-dialog h2{ font-family:var(--font-display); font-size:22px; margin-bottom:8px; color:var(--c-text-1); }
.auth-dialog p{ font-size:14px; color:var(--c-text-2); margin-bottom:24px; }
.auth-dialog input{
  width:100%; padding:10px 14px; border:2px solid var(--c-bg-2); border-radius:var(--radius-sm);
  font-size:14px; font-family:var(--font-body); outline:none; transition:border .2s; margin-bottom:16px;
}
.auth-dialog input:focus{ border-color:var(--brand-2); }
.auth-dialog button{
  width:100%; padding:10px; border:none; border-radius:var(--radius-sm);
  background:var(--brand-grad); color:#fff; font-size:14px; font-weight:600; cursor:pointer;
  font-family:var(--font-body); transition:opacity .2s;
}
.auth-dialog button:hover{ opacity:0.9; }
.auth-dialog .auth-error{ color:#EF4444; font-size:13px; margin-top:8px; }
.auth-dialog .auth-hint{ font-size:12px; color:var(--c-text-3); margin-top:12px; }

/* ── 空状态 ── */
.empty-state{ text-align:center; padding:40px; color:var(--c-text-3); font-size:14px; }

/* ── 响应式 ── */
@media (max-width:1200px){
  .stat-grid{ grid-template-columns:repeat(3, 1fr); }
}
@media (max-width:900px){
  .stat-grid{ grid-template-columns:repeat(2, 1fr); }
  .chart-row{ grid-template-columns:1fr; }
  .chart-row.three-col{ grid-template-columns:1fr; }
  .chart-row.two-one{ grid-template-columns:1fr; }
  .container{ padding:16px; }
  .navbar{ padding:12px 16px; }
}
@media (max-width:500px){
  .stat-grid{ grid-template-columns:1fr; }
}
</style>
</head>
<body>

<!-- ── 顶部导航 ── -->
<nav class="navbar">
  <h1>📊 JobRadar 数据看板</h1>
  <div class="nav-right">
    <span class="live-dot"></span><span class="last-update" id="lastUpdate">加载中…</span>
    <select id="dayRange">
      <option value="7">最近 7 天</option>
      <option value="15">最近 15 天</option>
      <option value="30" selected>最近 30 天</option>
      <option value="60">最近 60 天</option>
      <option value="90">最近 90 天</option>
    </select>
    <button onclick="refreshAll()" title="刷新数据">🔄 刷新</button>
    <button onclick="logout()" title="切换 API Key">🔑 切换密钥</button>
  </div>
</nav>

<div class="container">

  <!-- 统计卡片：6 张 -->
  <div class="stat-grid">
    <div class="stat-card">
      <div class="stat-icon blue">📊</div>
      <div class="stat-body">
        <div class="stat-label">总访问量</div>
        <div class="stat-value" id="sTotal">-</div>
        <div class="stat-sub">全部历史数据</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon green">📈</div>
      <div class="stat-body">
        <div class="stat-label">今日 PV</div>
        <div class="stat-value" id="sToday">-</div>
        <div class="stat-sub" id="sTodaySub"></div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon purple">👥</div>
      <div class="stat-body">
        <div class="stat-label">独立访客 IP</div>
        <div class="stat-value" id="sIps">-</div>
        <div class="stat-sub">近 30 天去重</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon amber">👤</div>
      <div class="stat-body">
        <div class="stat-label">注册用户</div>
        <div class="stat-value" id="sUsers">-</div>
        <div class="stat-sub" id="sUsersSub"></div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon indigo">💼</div>
      <div class="stat-body">
        <div class="stat-label">开放岗位</div>
        <div class="stat-value" id="sOpenJobs">-</div>
        <div class="stat-sub" id="sOpenJobsSub"></div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon red">⭐</div>
      <div class="stat-body">
        <div class="stat-label">活跃会员</div>
        <div class="stat-value" id="sMembers">-</div>
        <div class="stat-sub" id="sMembersSub"></div>
      </div>
    </div>
  </div>

  <!-- 图表行 -->
  <div class="chart-row">
    <div class="chart-card">
      <h3><span class="dot" style="background:var(--blue)"></span> 每日访问量趋势</h3>
      <canvas id="chartVisits"></canvas>
    </div>
    <div class="chart-card">
      <h3><span class="dot" style="background:var(--green)"></span> 每日注册用户</h3>
      <canvas id="chartReg"></canvas>
    </div>
  </div>

  <!-- 时段分布 + 来源分布 + 地区分布（三列） -->
  <div class="chart-row three-col">
    <div class="chart-card">
      <h3><span class="dot" style="background:var(--blue)"></span> 时段访问分布</h3>
      <canvas id="chartHourly"></canvas>
    </div>
    <div class="chart-card">
      <h3><span class="dot" style="background:var(--purple)"></span> 流量来源</h3>
      <canvas id="chartSources"></canvas>
    </div>
    <div class="chart-card">
      <h3><span class="dot" style="background:var(--amber)"></span> 访问地区 Top10</h3>
      <canvas id="chartRegions"></canvas>
    </div>
  </div>

  <!-- 岗位行业 + 招聘类型（2:1） -->
  <div class="chart-row two-one">
    <div class="chart-card">
      <h3><span class="dot" style="background:var(--blue)"></span> 岗位行业分布 Top10</h3>
      <canvas id="chartJobIndustry"></canvas>
    </div>
    <div class="chart-card">
      <h3><span class="dot" style="background:var(--green)"></span> 招聘类型分布</h3>
      <canvas id="chartJobRecruit"></canvas>
    </div>
  </div>

  <!-- 同步历史 + 日活趋势 -->
  <div class="chart-row">
    <div class="chart-card">
      <h3><span class="dot" style="background:var(--green)"></span> 每日同步新增岗位 <span style="font-weight:400;font-size:12px;color:var(--c-text-3)" id="syncSummary"></span></h3>
      <canvas id="chartSync"></canvas>
    </div>
    <div class="chart-card">
      <h3><span class="dot" style="background:var(--purple)"></span> 每日活跃用户 (DAU)</h3>
      <canvas id="chartDau"></canvas>
    </div>
  </div>

  <!-- 最近访问记录 -->
  <div class="chart-card" style="margin-bottom:28px">
    <h3>📋 最近访问记录</h3>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>时间</th><th>类型</th><th>来源</th><th>地区</th><th>路径</th><th>用户</th><th>IP</th></tr>
        </thead>
        <tbody id="recentTable"></tbody>
      </table>
    </div>
    <div id="recentEmpty" class="empty-state" style="display:none">暂无访问记录</div>
  </div>

  <!-- 注册用户表格 -->
  <div class="chart-card" style="margin-bottom:28px">
    <h3>👤 注册用户列表 <span style="font-weight:400;font-size:13px;color:var(--c-text-3)" id="userTotal"></span></h3>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>ID</th><th>账号</th><th>昵称</th><th>注册时间</th><th>会员状态</th><th>会员到期</th></tr>
        </thead>
        <tbody id="userTable"><tr class="loading-row"><td colspan="6">加载中…</td></tr></tbody>
      </table>
    </div>
    <div class="pagination" id="userPagination"></div>
  </div>

</div>

<script>
// ── 全局状态 ──
const API_BASE = (() => {
  const host = window.location.hostname;
  if (host === 'localhost' || host === '127.0.0.1') {
    return 'http://localhost:8080';
  }
  return window.location.origin;
})();

let charts = {};
let currentDays = 30;

// ── API Key 管理 ──
function getApiKey() {
  return localStorage.getItem('jr_admin_key') || '';
}
function setApiKey(key) {
  localStorage.setItem('jr_admin_key', key);
}
function clearApiKey() {
  localStorage.removeItem('jr_admin_key');
}

// ── API 请求封装 ──
async function apiGet(path) {
  const key = getApiKey();
  if (!key) throw new Error('NO_KEY');
  const res = await fetch(API_BASE + path, {
    headers: { 'X-Admin-Key': key }
  });
  if (res.status === 401) {
    clearApiKey();
    throw new Error('UNAUTHORIZED');
  }
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

// ── 认证对话框 ──
function showAuthDialog(error) {
  const existing = document.querySelector('.auth-overlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.className = 'auth-overlay';
  overlay.innerHTML = `
    <div class="auth-dialog">
      <h2>🔐 输入管理密钥</h2>
      <p>请输入 Admin API Key 以访问数据看板</p>
      <input type="password" id="authKeyInput" placeholder="粘贴 API Key…" autofocus>
      <button id="authSubmit">验证并进入</button>
      <div class="auth-error" id="authError">${error || ''}</div>
      <div class="auth-hint">Key 存储在浏览器本地，仅用于本次访问</div>
    </div>
  `;
  document.body.appendChild(overlay);

  const input = document.getElementById('authKeyInput');
  const btn = document.getElementById('authSubmit');
  const errEl = document.getElementById('authError');

  async function submit() {
    const key = input.value.trim();
    if (!key) { errEl.textContent = '请输入 API Key'; return; }
    setApiKey(key);
    btn.disabled = true;
    btn.textContent = '验证中…';
    try {
      await apiGet('/api/admin/analytics/summary');
      overlay.remove();
      refreshAll();
    } catch (e) {
      clearApiKey();
      errEl.textContent = e.message === 'UNAUTHORIZED' ? '❌ API Key 无效，请检查后重试' : '❌ 连接失败：' + e.message;
      btn.disabled = false;
      btn.textContent = '验证并进入';
    }
  }
  btn.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
}

// ── 登出 ──
function logout() {
  clearApiKey();
  destroyCharts();
  showAuthDialog('已清除密钥，请重新输入');
}

// ── 格式化数字 ──
function fmt(n) {
  if (n == null) return '-';
  if (n >= 10000) return (n / 10000).toFixed(1) + ' 万';
  return n.toLocaleString();
}

// ── 销毁图表 ──
function destroyCharts() {
  Object.values(charts).forEach(c => c.destroy());
  charts = {};
}

// ── 获取所有数据 ──
async function refreshAll() {
  if (!getApiKey()) {
    showAuthDialog('');
    return;
  }

  const days = parseInt(document.getElementById('dayRange').value);
  currentDays = days;

  try {
    const [summary, daily, recent, hourly, sources, regions, jobsStats, members, syncHistory, dauData] = await Promise.all([
      apiGet('/api/admin/analytics/summary'),
      apiGet('/api/admin/analytics/daily?days=' + days),
      apiGet('/api/admin/analytics/recent?limit=20'),
      apiGet('/api/admin/analytics/hourly?days=' + Math.min(days, 7)),
      apiGet('/api/admin/analytics/sources?days=' + days),
      apiGet('/api/admin/analytics/regions?days=' + days),
      apiGet('/api/admin/analytics/jobs-stats'),
      apiGet('/api/admin/analytics/members'),
      apiGet('/api/admin/analytics/sync-history?days=' + days),
      apiGet('/api/admin/analytics/dau?days=' + days),
    ]);

    renderSummary(summary, jobsStats, members);
    renderDailyChart(daily);
    renderRegChart(daily);
    renderRecentTable(recent);
    renderHourlyChart(hourly);
    renderSourcesChart(sources);
    renderRegionsChart(regions);
    renderJobIndustryChart(jobsStats);
    renderJobRecruitChart(jobsStats);
    renderSyncChart(syncHistory);
    renderDauChart(dauData);
    await loadUsers(0);

    const now = new Date();
    document.getElementById('lastUpdate').textContent =
      '更新于 ' + now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  } catch (e) {
    if (e.message === 'UNAUTHORIZED' || e.message === 'NO_KEY') {
      destroyCharts();
      showAuthDialog('API Key 无效或已过期');
    } else {
      console.error('数据加载失败', e);
      document.getElementById('lastUpdate').textContent = '加载失败';
    }
  }
}

// ── 渲染汇总卡片 ──
function renderSummary(s, jobs, members) {
  document.getElementById('sTotal').textContent = fmt(s.totalVisits);
  document.getElementById('sToday').textContent = fmt(s.todayVisits);
  document.getElementById('sIps').textContent = fmt(s.uniqueIps);
  document.getElementById('sUsers').textContent = fmt(s.totalUsers);
  document.getElementById('sOpenJobs').textContent = fmt(jobs.openJobs);
  document.getElementById('sMembers').textContent = fmt(members.activeMembers);

  document.getElementById('sTodaySub').textContent =
    s.activeUsers7d ? '7 日活跃 ' + s.activeUsers7d + ' 人' : '';
  document.getElementById('sUsersSub').textContent =
    s.newUsersToday ? '今日新增 ' + s.newUsersToday + ' 人' : '';
  document.getElementById('sOpenJobsSub').textContent =
    '共 ' + fmt(jobs.totalJobs) + ' 个岗位，' + fmt(jobs.distinctCompanies) + ' 家公司';
  document.getElementById('sMembersSub').textContent =
    '转化率 ' + members.conversionRate + '%';
}

// ── 每日访问量折线图 ──
function renderDailyChart(data) {
  if (charts.visits) charts.visits.destroy();
  const ctx = document.getElementById('chartVisits').getContext('2d');
  const labels = data.visits.map(d => d.date.slice(5)); // MM-DD
  const values = data.visits.map(d => d.count);

  charts.visits = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: '访问量 (PV)',
        data: values,
        borderColor: '#3B82F6',
        backgroundColor: 'rgba(59,130,246,0.08)',

// ── 同步历史柱状图 ──
function renderSyncChart(data) {
  if (charts.sync) charts.sync.destroy();
  const ctx = document.getElementById('chartSync').getContext('2d');
  const history = data.history || [];
  const labels = history.map(d => d.date.slice(5));
  const values = history.map(d => d.inserted);
  const bgColors = history.map(d => {
    if (d.status === 'SUCCESS') return 'rgba(16,185,129,0.7)';
    if (d.status === 'PARTIAL') return 'rgba(245,158,11,0.7)';
    if (d.status === 'FAILURE') return 'rgba(239,68,68,0.7)';
    return 'rgba(229,231,235,0.5)'; // NONE
  });
  const borderColors = history.map(d => {
    if (d.status === 'SUCCESS') return '#10B981';
    if (d.status === 'PARTIAL') return '#F59E0B';
    if (d.status === 'FAILURE') return '#EF4444';
    return '#E5E7EB';
  });

  // 汇总信息
  const totalInserted = history.reduce((s, d) => s + d.inserted, 0);
  const failDays = history.filter(d => d.status === 'FAILURE' || d.status === 'PARTIAL').length;
  document.getElementById('syncSummary').textContent =
    `（共新增 ${totalInserted} 条${failDays > 0 ? '，异常 ' + failDays + ' 天' : '，全部正常'}）`;

  charts.sync = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: '新增岗位',
        data: values,
        backgroundColor: bgColors,
        borderColor: borderColors,
        borderWidth: 1,
        borderRadius: 3,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#0F1729',
          titleFont: { family: '"PingFang SC","Microsoft YaHei",sans-serif' },
          bodyFont: { family: '"PingFang SC","Microsoft YaHei",sans-serif' },
          displayColors: false,
          callbacks: {
            title: items => data.history[items[0].dataIndex]?.date || '',
            label: ctx => {
              const d = data.history[ctx.dataIndex];
              let label = ctx.raw + ' 条新增';
              if (d.status === 'FAILURE' && d.error) label += ' (⚠ ' + d.error + ')';
              else if (d.status === 'PARTIAL') label += ' (⚠ 部分失败)';
              else if (d.status === 'NONE') label = '无同步记录';
              return label;
            }
          }
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 11 }, maxTicksLimit: 15, color: '#9CA3AF' } },
        y: { beginAtZero: true, grid: { color: '#F3F4F6' }, ticks: { font: { size: 11 }, color: '#9CA3AF', stepSize: 1, callback: v => v === 0 ? '0' : v } }
      },
      interaction: { intersect: false, mode: 'index' }
    }
  });
  document.getElementById('chartSync').parentElement.style.height = '300px';
}

// ── 最近访问记录表格 ──
function renderRecentTable(data) {
  const tbody = document.getElementById('recentTable');
  const empty = document.getElementById('recentEmpty');
  const visits = data.visits || [];

  if (visits.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  tbody.innerHTML = visits.map(v => {
    let sourceBadge = '';
    if (v.source === '搜索引擎') {
      sourceBadge = '<span class="badge badge-search">🔍 搜索</span>';
    } else if (v.source === '外部链接') {
      sourceBadge = '<span class="badge badge-ext">🔗 外链</span>';
    } else {
      sourceBadge = '<span class="badge badge-direct">直接</span>';
    }
    const region = v.region || '-';
    const regionShort = region.includes('-') ? region.split('-').slice(-2).join('') : region;
    return `
    <tr>
      <td>${(v.time || '').replace('T', ' ').substring(0, 19)}</td>
      <td><span class="badge ${v.visitType === 'page' ? 'page' : 'api'}">${v.visitType === 'page' ? '页面' : 'API'}</span></td>
      <td>${sourceBadge}</td>
      <td title="${esc(region)}" style="font-size:12px">${esc(regionShort)}</td>
      <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis" title="${esc(v.path)}">${esc(v.path)}</td>
      <td>${esc(v.username || '匿名')}</td>
      <td style="font-family:monospace;font-size:12px">${esc(v.ip || '-')}</td>
    </tr>`;
  }).join('');
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ── 注册用户表格（分页） ──
let userPage = 0;
const USER_PAGE_SIZE = 15;

async function loadUsers(page) {
  userPage = page;
  try {
    const data = await apiGet(`/api/admin/analytics/users?page=${page}&size=${USER_PAGE_SIZE}`);
    renderUsersTable(data);
  } catch (e) {
    document.getElementById('userTable').innerHTML =
      '<tr class="loading-row"><td colspan="6">加载失败：' + esc(e.message) + '</td></tr>';
  }
}

function renderUsersTable(data) {
  const tbody = document.getElementById('userTable');
  const users = data.users || [];
  const total = data.total || 0;
  const totalPages = data.totalPages || 0;

  document.getElementById('userTotal').textContent =
    `（共 ${total} 人，第 ${userPage + 1}/${Math.max(totalPages, 1)} 页）`;

  if (users.length === 0) {
    tbody.innerHTML = '<tr class="loading-row"><td colspan="6">暂无注册用户</td></tr>';
    document.getElementById('userPagination').innerHTML = '';
    return;
  }

  tbody.innerHTML = users.map(u => {
    const isMember = u.memberStatus === '会员';
    const createdAt = (u.createdAt || '').replace('T', ' ').substring(0, 16);
    const memberUntil = u.memberUntil
      ? u.memberUntil.replace('T', ' ').substring(0, 16)
      : '-';
    return `
    <tr>
      <td>${u.id}</td>
      <td>${esc(u.account)}</td>
      <td>${esc(u.displayName || '-')}</td>
      <td>${createdAt}</td>
      <td><span class="badge ${isMember ? 'member' : 'free'}">${u.memberStatus}</span></td>
      <td style="font-size:12px;color:var(--c-text-2)">${memberUntil}</td>
    </tr>`;
  }).join('');

  // 分页控件
  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  const pg = document.getElementById('userPagination');
  if (totalPages <= 1) { pg.innerHTML = ''; return; }

  let html = '';
  html += `<button onclick="loadUsers(0)" ${userPage === 0 ? 'disabled' : ''}>««</button>`;
  html += `<button onclick="loadUsers(${userPage - 1})" ${userPage === 0 ? 'disabled' : ''}>«</button>`;

  const start = Math.max(0, userPage - 2);
  const end = Math.min(totalPages, userPage + 3);
  for (let i = start; i < end; i++) {
    html += `<button onclick="loadUsers(${i})" class="${i === userPage ? 'active' : ''}">${i + 1}</button>`;
  }

  html += `<button onclick="loadUsers(${userPage + 1})" ${userPage >= totalPages - 1 ? 'disabled' : ''}>»</button>`;
  html += `<button onclick="loadUsers(${totalPages - 1})" ${userPage >= totalPages - 1 ? 'disabled' : ''}>»»</button>`;
  html += `<span class="page-info">共 ${totalPages} 页</span>`;
  pg.innerHTML = html;
}

});

// 自动刷新（60 秒）
let autoRefreshTimer;
function startAutoRefresh() {
  clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(async () => {
    if (!getApiKey()) return;
    try {
      const [summary, jobsStats, members] = await Promise.all([
        apiGet('/api/admin/analytics/summary'),
        apiGet('/api/admin/analytics/jobs-stats'),
        apiGet('/api/admin/analytics/members'),
      ]);
      renderSummary(summary, jobsStats, members);
      const now = new Date();
      document.getElementById('lastUpdate').textContent =
        '更新于 ' + now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    } catch (e) { /* 静默失败 */ }
  }, 60000);
}

// ── 初始加载 ──
refreshAll().then(() => startAutoRefresh());
